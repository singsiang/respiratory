<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <!-- 終極鎖定：禁止縮放、適配瀏海螢幕、適配安全區域 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- 🔐 資安修正：加入 Content Security Policy (CSP) 限制外部資源，防範 XSS 與資料外洩 -->
    <!-- 注意：由於使用了 Tailwind CDN，必須允許 unsafe-inline 的 style 與 script -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
    
    <title>寶寶著色本</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 徹底防止 iOS/iPadOS 的反白、拖曳與橡皮筋滾動效果 */
        body, html {
            overscroll-behavior: none;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            /* 修正 Safari 100vh 裁切問題 */
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        .color-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .color-btn.active {
            transform: scale(1.25);
            box-shadow: 0 0 0 4px white, 0 0 0 8px currentColor;
            z-index: 10;
        }

        /* 隱藏捲軸但保留滾動功能 */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        button, input { font: inherit; }
        button:focus-visible, input:focus-visible, .custom-color:focus-within {
            outline: 3px solid #2563eb;
            outline-offset: 4px;
        }
        .palette-controls { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; min-height: 0; }
        .paint-settings-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; width: 56px; height: 64px; flex: none; border-radius: 14px; background: #f1f5f9; color: #334155; font-size: 12px; font-weight: 700; }
        .paint-settings-btn:hover { background: #e2e8f0; }
        .brush-preview { width: 30px; height: 30px; flex: none; border: 1px solid #b8b6b0; border-radius: 9px; background-size: 48px 48px; }
        .quick-color-scroll { flex: 1; min-width: 0; min-height: 0; overflow-x: auto; padding: 12px; touch-action: pan-x; }
        .quick-colors { display: flex; align-items: center; gap: 16px; width: max-content; }
        .paint-dialog { width: min(600px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); padding: 0; margin: auto; border: 2px solid #c8bca4; border-radius: 18px; background: #fffdf6; color: #34362f; overflow: hidden; }
        .paint-dialog::backdrop { background: rgb(15 23 42 / 28%); }
        .paint-dialog-shell { display: flex; flex-direction: column; max-height: calc(100dvh - 28px); }
        .paint-dialog-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px 8px 20px; border-bottom: 1px solid #e3dece; }
        .paint-dialog-header h2 { margin: 0; font-size: 20px; font-weight: 800; }
        .paint-close { display: grid; place-items: center; flex: none; width: 44px; height: 44px; border-radius: 12px; background: #f0ecdf; color: #46483e; }
        .paint-close:hover { background: #e4decc; }
        .paint-dialog-body { overflow-y: auto; min-height: 0; padding: 14px 20px 16px; touch-action: pan-y; overscroll-behavior: contain; scrollbar-color: #b6ae99 #f6f2e7; scrollbar-width: thin; }
        .paint-section-title { margin: 0 0 8px; font-size: 14px; font-weight: 700; color: #515345; }
        .color-section-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
        .color-section-header .paint-section-title { margin: 0; }
        .paint-pattern-options { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-bottom: 18px; }
        .pattern-choice { display: flex; flex-direction: column; gap: 5px; align-items: center; padding: 4px; border: 2px solid transparent; border-radius: 12px; font-size: 12px; font-weight: 700; color: #46483e; }
        .pattern-choice[aria-pressed="true"] { border-color: #42483b; background: #edeadf; }
        .pattern-choice:hover { background: #f0ecdf; }
        .pattern-swatch { display: block; width: 100%; aspect-ratio: 1; border: 1px solid rgb(65 63 53 / 18%); border-radius: 9px; background-size: 48px 48px; }
        .expanded-colors { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 10px; padding: 4px; }
        .palette-swatch { aspect-ratio: 1; width: 100%; border: 1px solid rgb(65 63 53 / 22%); border-radius: 11px; }
        .palette-swatch[aria-pressed="true"] { outline: 3px solid #42483b; outline-offset: 2px; }
        .palette-swatch:hover { border-color: #42483b; }
        .custom-color { display: flex; align-items: center; gap: 8px; width: fit-content; min-height: 44px; margin: 0; border-radius: 10px; color: #46483e; font-size: 13px; font-weight: 700; cursor: pointer; }
        .color-wheel { width: 24px; height: 24px; border: 1px solid #c8bca4; border-radius: 7px; background: conic-gradient(#f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00); }
        #customColorInput { width: 44px; height: 40px; padding: 2px; border: 1px solid #c8bca4; border-radius: 8px; background: #fffdf6; cursor: pointer; }
        .paint-dialog-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 20px; border-top: 1px solid #e3dece; background: #f7f4e9; }
        .paint-selection { display: flex; align-items: center; gap: 9px; min-width: 0; font-size: 14px; font-weight: 700; }
        #paintSelectionText { overflow-wrap: anywhere; }
        .paint-done { flex: none; min-height: 44px; padding: 10px 18px; border-radius: 12px; background: #315c3e; color: #fff; font-weight: 700; }
        .paint-done:hover { background: #254a30; }
        @media (min-width: 768px) {
            .palette-controls { flex-direction: column; width: 100%; }
            .quick-color-scroll { width: 100%; overflow-x: hidden; overflow-y: auto; touch-action: pan-y; }
            .quick-colors { flex-direction: column; width: 100%; }
        }
        @media (max-width: 520px) {
            .paint-dialog-body { padding: 12px 14px 14px; }
            .paint-dialog-header, .paint-dialog-footer { padding-left: 14px; padding-right: 14px; }
            .paint-pattern-options { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; margin-bottom: 14px; }
            .pattern-choice { flex-direction: row; gap: 5px; font-size: 11px; padding: 4px 2px; }
            .pattern-swatch { width: 32px; height: 38px; aspect-ratio: auto; flex: none; }
            .expanded-colors { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
        }
        @media (max-width: 480px) {
            .toolbar-actions, .toolbar-pages { gap: 4px; padding: 0; }
            .quick-color-scroll { display: none; }
            .palette-controls { justify-content: center; }
            .paint-settings-btn { width: 48px; height: 48px; gap: 0; font-size: 11px; }
            .paint-settings-btn .brush-preview { width: 26px; height: 26px; border-radius: 7px; }
        }
        @media (max-width: 359px) {
            .paint-pattern-options { grid-template-columns: repeat(3, minmax(0, 1fr)); }
            .expanded-colors { grid-template-columns: repeat(5, minmax(0, 1fr)); }
            .paint-dialog-header h2 { font-size: 18px; }
        }
        @media (min-width: 768px) and (max-height: 600px) {
            #drawingToolbar { width: 100px; padding: 8px; }
            .toolbar-actions, .toolbar-pages { gap: 6px; padding: 0; }
            .toolbar-actions > button, .toolbar-pages > button { width: 44px; height: 44px; }
            .paint-settings-btn { width: 56px; height: 48px; gap: 0; font-size: 11px; }
            .paint-settings-btn .brush-preview { width: 26px; height: 26px; }
            .quick-colors .color-btn { width: 44px; height: 44px; }
        }
        @media (min-width: 600px) and (max-height: 500px) {
            .paint-pattern-options { grid-template-columns: repeat(7, minmax(0, 1fr)); margin-bottom: 8px; }
            .pattern-choice { flex-direction: row; gap: 4px; padding: 4px 2px; font-size: 11px; }
            .pattern-swatch { width: 28px; height: 34px; aspect-ratio: auto; flex: none; }
        }
        @media (prefers-reduced-motion: reduce) {
            .color-btn { transition: none; }
        }
    </style>
</head>
<body class="bg-blue-50 fixed inset-0 flex flex-col md:flex-row text-gray-800 pb-[env(safe-area-inset-bottom)] pl-[env(safe-area-inset-left)] pr-[env(safe-area-inset-right)] pt-[env(safe-area-inset-top)]">

    <!-- 工具列 (左側或下方) -->
    <div id="drawingToolbar" class="w-full md:w-32 lg:w-36 bg-white shadow-xl flex md:flex-col items-center justify-between p-2 md:py-6 z-30 order-2 md:order-1 flex-shrink-0">
        
        <!-- 工具按鈕區 (上一步、下一步、清除) -->
        <div class="toolbar-actions flex md:flex-col gap-2 md:gap-3 flex-shrink-0 px-2 md:px-0">
            <button id="undoBtn" class="w-11 h-11 md:w-14 md:h-14 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center shadow-sm active:bg-indigo-200 active:scale-95 transition-transform disabled:opacity-40 disabled:active:scale-100 disabled:cursor-not-allowed">
                <svg class="w-6 h-6 md:w-7 md:h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 10h10a5 5 0 0 1 5 5v2a5 5 0 0 1-5 5H8" />
                    <path d="M3 10l6-6" />
                    <path d="M3 10l6 6" />
                </svg>
            </button>
            <button id="redoBtn" class="w-11 h-11 md:w-14 md:h-14 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center shadow-sm active:bg-indigo-200 active:scale-95 transition-transform disabled:opacity-40 disabled:active:scale-100 disabled:cursor-not-allowed">
                <svg class="w-6 h-6 md:w-7 md:h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 10H11a5 5 0 0 0-5 5v2a5 5 0 0 0 5 5h5" />
                    <path d="M21 10l-6-6" />
                    <path d="M21 10l-6 6" />
                </svg>
            </button>
            <button id="clearBtn" class="w-11 h-11 md:w-14 md:h-14 bg-red-100 text-red-600 rounded-full flex items-center justify-center shadow-sm active:bg-red-200 active:scale-95 transition-transform">
                <svg class="w-6 h-6 md:w-7 md:h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2M10 11v6M14 11v6"/>
                </svg>
            </button>
        </div>

        <!-- 顏色選擇區 -->
        <div class="palette-controls">
            <button id="paintSettingsBtn" type="button" class="paint-settings-btn" aria-haspopup="dialog" aria-controls="paintDialog" aria-expanded="false" aria-label="開啟顏色與圖樣">
                <span id="activeBrushPreview" class="brush-preview" aria-hidden="true"></span>
                <span>顏色</span>
            </button>
            <div class="quick-color-scroll hide-scrollbar">
                <div id="colorPalette" class="quick-colors" role="group" aria-label="常用顏色"></div>
            </div>
        </div>

        <!-- 翻頁按鈕區 -->
        <div class="toolbar-pages flex md:flex-col gap-2 justify-center mt-auto flex-shrink-0 px-2 md:px-0">
            <button id="prevBtn" class="w-11 h-11 md:w-14 md:h-14 bg-green-100 text-green-600 rounded-2xl md:rounded-full flex items-center justify-center shadow-sm active:bg-green-200 active:scale-95 transition-transform">
                <svg class="w-7 h-7 md:w-10 md:h-10 transform md:-rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 19l-7-7 7-7" />
                </svg>
            </button>
            <button id="nextBtn" class="w-11 h-11 md:w-14 md:h-14 bg-green-100 text-green-600 rounded-2xl md:rounded-full flex items-center justify-center shadow-sm active:bg-green-200 active:scale-95 transition-transform">
                <svg class="w-7 h-7 md:w-10 md:h-10 transform md:-rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 5l7 7-7 7" />
                </svg>
            </button>
        </div>
    </div>

    <!-- 繪圖區 (右側或上方) -->
    <div class="flex-1 flex justify-center items-center p-3 md:p-6 relative order-1 md:order-2 min-h-0 min-w-0 h-full w-full">
        <!-- 畫布外框 -->
        <div id="canvasWrapper" class="relative bg-white rounded-3xl shadow-2xl overflow-hidden w-full h-full border-4 border-white">
            
            <!-- 繪圖用的 Canvas (底層) -->
            <canvas id="drawingCanvas" class="absolute inset-0 w-full h-full touch-none z-10"></canvas>
            
            <!-- SVG 輪廓圖案 (頂層，忽略點擊事件) -->
            <div id="svgContainer" class="absolute inset-0 w-full h-full pointer-events-none z-20 flex justify-center items-center p-6 md:p-12">
                <!-- SVG 動態插入 -->
            </div>

        </div>
    </div>

    <dialog id="paintDialog" class="paint-dialog" aria-labelledby="paintDialogTitle">
        <div class="paint-dialog-shell">
            <header class="paint-dialog-header">
                <h2 id="paintDialogTitle">顏色與圖樣</h2>
                <button id="paintCloseBtn" type="button" class="paint-close" aria-label="關閉顏色與圖樣">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
                </button>
            </header>
            <div class="paint-dialog-body">
                <section aria-labelledby="patternTitle">
                    <h3 id="patternTitle" class="paint-section-title">筆刷圖樣</h3>
                    <div id="patternPalette" class="paint-pattern-options" role="group" aria-label="筆刷圖樣"></div>
                </section>
                <section aria-labelledby="expandedColorTitle">
                    <div class="color-section-header">
                        <h3 id="expandedColorTitle" class="paint-section-title">選擇顏色</h3>
                        <label class="custom-color" for="customColorInput">
                            <span class="color-wheel" aria-hidden="true"></span>
                            <span>自訂顏色</span>
                            <input id="customColorInput" type="color" value="#e53935" aria-label="自訂顏色" />
                        </label>
                    </div>
                    <div id="expandedColorPalette" class="expanded-colors" role="group" aria-label="完整色盤"></div>
                </section>
            </div>
            <footer class="paint-dialog-footer">
                <div class="paint-selection" role="status" aria-live="polite">
                    <span id="selectedBrushPreview" class="brush-preview" aria-hidden="true"></span>
                    <span id="paintSelectionText"></span>
                </div>
                <button id="paintDoneBtn" type="button" class="paint-done">開始畫畫</button>
            </footer>
        </div>
    </dialog>

            // 13. 萬聖節南瓜著色圖
            `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" class="w-full h-full max-w-full max-h-full drop-shadow-md" preserveAspectRatio="xMidYMid meet" role="img" aria-label="萬聖節南瓜著色圖" fill="none" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">

    <path d="M 103,61 C 79,60 68,75 66,103 Q 62,122 63,142 M 74,160 Q 82,185 97,193 M 151,67 C 181,95 181,138 168,168" />

    <path d="M 74,129 Q 91,147 108,148 L 108,155 L 120,157 L 124,149 Q 145,149 164,134 C 151,170 133,183 109,177 C 91,172 80,154 74,129 Z M 70,130 L 74,127 L 78,130 M 160,134 L 164,131 L 167,135" />

    <path d="M 64,184 L 54,193 L 47,189 L 42,194 L 38,186 L 28,189 L 29,181 L 17,181 L 22,172 L 10,168 L 23,163 L 16,155 L 29,156 L 28,145 L 38,149 L 43,136 L 50,149 L 58,145 L 59,157 L 71,152 L 69,165 L 78,168 L 70,176 Z" />
    <path d="M 43,145 L 64,184 Q 68,194 83,202 M 55,173 L 36,166 M 50,161 L 40,155 M 58,177 L 68,164 M 54,169 L 56,157 M 49,164 L 34,175" />

    <g transform="translate(-5 0)">
      <path d="M 205,177 L 202,167 L 209,161 L 203,155 L 212,152 L 210,141 L 220,145 L 228,132 L 229,145 L 237,143 L 234,155 L 239,160 L 230,165 L 233,173 L 222,174 L 219,183 Z" />

    <path d="M 180,178 C 168,180 160,197 166,215 Q 169,223 177,224 M 191,179 C 203,194 201,215 187,226 M 163,176 C 148,190 147,213 156,221 M 205,182 C 216,193 214,210 207,220" />

        ];

        let currentTemplateIndex = 0;
        let currentColor = colors[0];
        let currentColorName = quickColorNames[0];
        let currentPattern = 'solid';
        let isDrawing = false;
        let activePointerId = null;
        let activeBrushStyle = null;
        let restoreRequest = 0;
        let canvasFrame = null;
        const brushSize = 35; 

        // 歷史紀錄狀態管理
        let history = [];
        let historyStep = -1;

        // 綁定 DOM
        const canvas = document.getElementById('drawingCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const canvasWrapper = document.getElementById('canvasWrapper');
        const svgContainer = document.getElementById('svgContainer');
        const colorPalette = document.getElementById('colorPalette');
        const undoBtn = document.getElementById('undoBtn');
        const redoBtn = document.getElementById('redoBtn');
        const paintDialog = document.getElementById('paintDialog');
        const paintSettingsBtn = document.getElementById('paintSettingsBtn');
        const expandedColorPalette = document.getElementById('expandedColorPalette');
        const patternPalette = document.getElementById('patternPalette');
        const customColorInput = document.getElementById('customColorInput');

        function motifColor(color) {
            const rgb = [1, 3, 5].map(index => parseInt(color.slice(index, index + 2), 16));
            const brightness = (rgb[0] * 0.2126 + rgb[1] * 0.7152 + rgb[2] * 0.0722) / 255;
            const target = brightness > 0.82 ? [80, 88, 100] : [255, 255, 255];
            return `rgb(${rgb.map((value, index) => Math.round(value * 0.38 + target[index] * 0.62)).join(',')})`;
        }

        function makeBrushTile(color, pattern, resolution = 2) {
            const tile = document.createElement('canvas');
            tile.width = tile.height = 48 * resolution;
            const tileCtx = tile.getContext('2d');
            tileCtx.scale(resolution, resolution);
            tileCtx.fillStyle = color;
            tileCtx.fillRect(0, 0, 48, 48);
            tileCtx.fillStyle = tileCtx.strokeStyle = motifColor(color);
            if (pattern === 'stripes') {
                for (let x = -48; x <= 48; x += 16) {
                    tileCtx.beginPath();
                    tileCtx.moveTo(x, 0);
                    tileCtx.lineTo(x + 7, 0);
                    tileCtx.lineTo(x + 55, 48);
                    tileCtx.lineTo(x + 48, 48);
                    tileCtx.closePath();
                    tileCtx.fill();
                }
            } else if (pattern === 'checker') {
                tileCtx.fillRect(0, 0, 24, 24);
                tileCtx.fillRect(24, 24, 24, 24);
            } else if (pattern !== 'solid') {
                [[12, 12], [36, 36]].forEach(([x, y]) => {
                    tileCtx.save();
                    tileCtx.translate(x, y);
                    if (pattern === 'stars') {
                        tileCtx.beginPath();
                        for (let i = 0; i < 10; i++) {
                            const radius = i % 2 === 0 ? 8 : 3.5;
                            const angle = -Math.PI / 2 + i * Math.PI / 5;
                            const px = Math.cos(angle) * radius;
                            const py = Math.sin(angle) * radius;
                            if (i === 0) tileCtx.moveTo(px, py); else tileCtx.lineTo(px, py);
                        }
                        tileCtx.closePath();
                        tileCtx.fill();
                    } else if (pattern === 'hearts') {
                        tileCtx.beginPath();
                        tileCtx.moveTo(0, 7);
                        tileCtx.bezierCurveTo(-14, -1, -7, -12, 0, -5);
                        tileCtx.bezierCurveTo(7, -12, 14, -1, 0, 7);
                        tileCtx.fill();
                    } else if (pattern === 'flowers') {
                        for (let petal = 0; petal < 5; petal++) {
                            const angle = petal * Math.PI * 2 / 5 - Math.PI / 2;
                            tileCtx.beginPath();
                            tileCtx.arc(Math.cos(angle) * 4.4, Math.sin(angle) * 4.4, 3.3, 0, Math.PI * 2);
                            tileCtx.fill();
                        }
                        tileCtx.fillStyle = color;
                        tileCtx.beginPath();
                        tileCtx.arc(0, 0, 2.2, 0, Math.PI * 2);
                        tileCtx.fill();
                    } else if (pattern === 'snowflakes') {
                        tileCtx.lineWidth = 1.8;
                        tileCtx.lineCap = 'round';
                        for (let arm = 0; arm < 6; arm++) {
                            tileCtx.save();
                            tileCtx.rotate(arm * Math.PI / 3);
                            tileCtx.beginPath();
                            tileCtx.moveTo(0, 0);
                            tileCtx.lineTo(0, -8);
                            tileCtx.moveTo(-3, -5);
                            tileCtx.lineTo(0, -3);
                            tileCtx.lineTo(3, -5);
                            tileCtx.stroke();
                            tileCtx.restore();
                        }
                    }
                    tileCtx.restore();
                });
            }
            return tile;
        }

        function brushStyle() {
            if (currentPattern === 'solid') return currentColor;
            const pattern = ctx.createPattern(makeBrushTile(currentColor, currentPattern), 'repeat');
            if (pattern && typeof pattern.setTransform === 'function') {
                // 將兩倍解析度的材質還原成 48px，讓高解析度畫面維持相同圖樣大小。
                pattern.setTransform({ a: 0.5, b: 0, c: 0, d: 0.5, e: 0, f: 0 });
                return pattern;
            }
            return ctx.createPattern(makeBrushTile(currentColor, currentPattern, 1), 'repeat') || currentColor;
        }

        function updatePaintSelection() {
            document.querySelectorAll('.color-btn, .palette-swatch').forEach(button => {
                const selected = button.dataset.color === currentColor;
                button.classList.toggle('active', selected);
                button.setAttribute('aria-pressed', String(selected));
            });
            patternPalette.querySelectorAll('.pattern-choice').forEach(button => {
                button.setAttribute('aria-pressed', String(button.dataset.pattern === currentPattern));
                button.querySelector('.pattern-swatch').style.backgroundImage = `url("${makeBrushTile(currentColor, button.dataset.pattern).toDataURL()}")`;
            });
            const preview = `url("${makeBrushTile(currentColor, currentPattern).toDataURL()}")`;
            document.getElementById('activeBrushPreview').style.backgroundImage = preview;
            document.getElementById('selectedBrushPreview').style.backgroundImage = preview;
            const patternName = brushPatterns.find(pattern => pattern.id === currentPattern).name;
            document.getElementById('paintSelectionText').textContent = `${patternName} · ${currentColorName}`;
            paintSettingsBtn.setAttribute('aria-label', `開啟顏色與圖樣，目前是${currentColorName}${patternName}`);
            customColorInput.value = currentColor;
        }

        function selectColor(color, name) {
            if (!/^#[0-9a-f]{6}$/i.test(color)) return;
            currentColor = color.toLowerCase();
            currentColorName = name;
            updatePaintSelection();
        }

        // 生成顏色按鈕
        colors.forEach((color, index) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'color-btn w-10 h-10 md:w-12 md:h-12 rounded-full flex-shrink-0 cursor-pointer';
            btn.style.backgroundColor = color;
            btn.style.color = color;
            btn.dataset.color = color;
            btn.setAttribute('aria-label', quickColorNames[index]);
            btn.title = quickColorNames[index];
            btn.addEventListener('click', () => selectColor(color, quickColorNames[index]));
            colorPalette.appendChild(btn);
        });

        paletteRows.forEach((row, rowIndex) => row.forEach((color, columnIndex) => {
            const btn = document.createElement('button');
            const name = paletteNames[rowIndex][columnIndex];
            btn.type = 'button';
            btn.className = 'palette-swatch';
            btn.style.backgroundColor = color;
            btn.dataset.color = color;
            btn.setAttribute('aria-label', name);
            btn.title = name;
            btn.addEventListener('click', () => selectColor(color, name));
            expandedColorPalette.appendChild(btn);
        }));

        brushPatterns.forEach(pattern => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'pattern-choice';
            btn.dataset.pattern = pattern.id;
            btn.setAttribute('aria-label', `${pattern.name}筆刷`);
            const preview = document.createElement('span');
            preview.className = 'pattern-swatch';
            preview.setAttribute('aria-hidden', 'true');
            const name = document.createElement('span');
            name.textContent = pattern.name;
            btn.append(preview, name);
            btn.addEventListener('click', () => {
                currentPattern = pattern.id;
                updatePaintSelection();
            });
            patternPalette.appendChild(btn);
        });

        ['input', 'change'].forEach(event => customColorInput.addEventListener(event, () => {
            selectColor(customColorInput.value, '自訂色');
        }));
        paintSettingsBtn.addEventListener('click', () => {
            stopDrawing();
            paintDialog.showModal();
            paintDialog.querySelector('.paint-dialog-body').scrollTop = 0;
            paintSettingsBtn.setAttribute('aria-expanded', 'true');
            patternPalette.querySelector('[aria-pressed="true"]').focus({ preventScroll: true });
        });
        ['paintCloseBtn', 'paintDoneBtn'].forEach(id => document.getElementById(id).addEventListener('click', () => paintDialog.close()));
        paintDialog.addEventListener('close', () => {
            paintSettingsBtn.setAttribute('aria-expanded', 'false');
            paintSettingsBtn.focus({ preventScroll: true });
        });
        paintDialog.addEventListener('click', event => {
            const bounds = paintDialog.getBoundingClientRect();
            if (event.target === paintDialog && (event.clientX < bounds.left || event.clientX > bounds.right || event.clientY < bounds.top || event.clientY > bounds.bottom)) {
                paintDialog.close();
            }
        });
        [['undoBtn', '上一步'], ['redoBtn', '下一步'], ['clearBtn', '清除畫布'], ['prevBtn', '上一張'], ['nextBtn', '下一張']].forEach(([id, label]) => {
            const button = document.getElementById(id);
            button.type = 'button';
            button.setAttribute('aria-label', label);
            button.title = label;
        });
        updatePaintSelection();

        function saveState() {
            if (historyStep < history.length - 1) {
                history.length = historyStep + 1;
            }
            history.push({ image: canvas.toDataURL(), frame: canvasFrame });
            historyStep++;
            updateHistoryButtons();
        }

        function undo() {
            if (historyStep > 0) {
                historyStep--;
                restoreState(history[historyStep]);
            } else if (historyStep === 0) {
                historyStep--;
                clearCanvas(false); 
            }
            updateHistoryButtons();
        }

        function redo() {
            if (historyStep < history.length - 1) {
                historyStep++;
                restoreState(history[historyStep]);
            }
            updateHistoryButtons();
        }

        function measureCanvasFrame() {
            const bounds = canvas.getBoundingClientRect();
            const svg = svgContainer.querySelector('svg');
            const matrix = svg ? svg.getScreenCTM() : null;
            return {
                x: matrix ? matrix.e - bounds.left : 0,
                y: matrix ? matrix.f - bounds.top : 0,
                scale: matrix ? matrix.a : 1,
                dpr: window.devicePixelRatio || 1
            };
        }

        function drawSnapshot(image, previousFrame) {
            // 筆畫沿用 SVG 的等比例縮放與位移，避免旋轉畫面後偏離輪廓。
            const frame = measureCanvasFrame();
            const previous = previousFrame || frame;
            const scale = frame.scale / previous.scale;
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.setTransform(frame.dpr, 0, 0, frame.dpr, 0, 0);
            ctx.drawImage(image,
                frame.x - previous.x * scale, frame.y - previous.y * scale,
                image.width / previous.dpr * scale, image.height / previous.dpr * scale);
            canvasFrame = frame;
        }

        function restoreState(state) {
            const request = ++restoreRequest;
            const img = new Image();
            img.onload = () => {
                if (request !== restoreRequest) return;
                drawSnapshot(img, state.frame);
            };
            img.src = state.image;
        }

        function updateHistoryButtons() {
            undoBtn.disabled = historyStep < 0;
            redoBtn.disabled = historyStep >= history.length - 1;
        }

        // 載入模板
        function loadTemplate() {
            stopDrawing();
            // 🔐 資安修正：在此確保賦值的 templates 皆為內部靜態寫死字串。
            // 若未來改為從 API 獲取使用者上傳的 SVG，請務必先經過 DOMPurify 清洗：
            // svgContainer.innerHTML = DOMPurify.sanitize(templates[currentTemplateIndex]);
            svgContainer.innerHTML = templates[currentTemplateIndex];
            
            history = [];
            historyStep = -1;
            clearCanvas(false);
            updateHistoryButtons();
        }

        function clearCanvas(save = true) {
            restoreRequest++;
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const dpr = window.devicePixelRatio || 1;
            ctx.scale(dpr, dpr);
            canvasFrame = measureCanvasFrame();
            if (save) saveState();
        }

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            const width = Math.max(1, Math.round(rect.width * dpr));
            const height = Math.max(1, Math.round(rect.height * dpr));
            if (canvas.width === width && canvas.height === height) return;
            stopDrawing();
            restoreRequest++;
            const previous = document.createElement('canvas');
            previous.width = canvas.width;
            previous.height = canvas.height;
            previous.getContext('2d').drawImage(canvas, 0, 0);
            const previousFrame = canvasFrame;
            canvas.width = width;
            canvas.height = height;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            drawSnapshot(previous, previousFrame);
        }

        window.addEventListener('resize', resizeCanvas);

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: e.clientX - rect.left,
                y: e.clientY - rect.top
            };
        }

        canvas.addEventListener('pointerdown', (e) => {
            if (e.button !== 0 || activePointerId !== null) return;
            restoreRequest++;
            isDrawing = true;
            activePointerId = e.pointerId;
            activeBrushStyle = brushStyle();
            canvas.setPointerCapture(e.pointerId);
            const pos = getPos(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
            ctx.fillStyle = activeBrushStyle;
            ctx.arc(pos.x, pos.y, brushSize / 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!isDrawing || e.pointerId !== activePointerId) return;
            const pos = getPos(e);
            ctx.strokeStyle = activeBrushStyle;
            ctx.lineWidth = brushSize;
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
        });

        function stopDrawing() {
            if (isDrawing) {
                isDrawing = false;
                const pointerId = activePointerId;
                activePointerId = null;
                activeBrushStyle = null;
                if (canvas.hasPointerCapture(pointerId)) canvas.releasePointerCapture(pointerId);
                saveState();
            }
        }
        ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(event => canvas.addEventListener(event, e => {
            if (e.pointerId === activePointerId) stopDrawing();
        }));

        document.getElementById('undoBtn').addEventListener('click', undo);
        document.getElementById('redoBtn').addEventListener('click', redo);
        
        document.getElementById('clearBtn').addEventListener('click', () => {
            if (historyStep >= 0) {
                clearCanvas(true);
            }
        });
        
        document.getElementById('nextBtn').addEventListener('click', () => {
            currentTemplateIndex = (currentTemplateIndex + 1) % templates.length;
            loadTemplate();
        });
        document.getElementById('prevBtn').addEventListener('click', () => {
            currentTemplateIndex = (currentTemplateIndex - 1 + templates.length) % templates.length;
            loadTemplate();
        });

        // 初始化
        setTimeout(() => {
            resizeCanvas();
            loadTemplate();
        }, 100);
    </script>
