<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <!-- 終極鎖定：禁止縮放、適配瀏海螢幕、適配安全區域 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- 🔐 資安修正：加入 Content Security Policy (CSP) 限制外部資源，防範 XSS 與資料外洩 -->
    <!-- 注意：由於使用了 Tailwind CDN，必須允許 unsafe-inline 的 style 與 script -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
    
    <title>寶寶著色本</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 徹底防止 iOS/iPadOS 的反白、拖曳與橡皮筋滾動效果 */
        body, html {
            overscroll-behavior: none;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            /* 修正 Safari 100vh 裁切問題 */
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        .color-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .color-btn.active {
            transform: scale(1.25);
            box-shadow: 0 0 0 4px white, 0 0 0 8px currentColor;
            z-index: 10;
        }

        /* 隱藏捲軸但保留滾動功能 */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-blue-50 fixed inset-0 flex flex-col md:flex-row text-gray-800 pb-[env(safe-area-inset-bottom)] pl-[env(safe-area-inset-left)] pr-[env(safe-area-inset-right)] pt-[env(safe-area-inset-top)]">

    <!-- 工具列 (左側或下方) -->
    <div class="w-full md:w-32 lg:w-36 bg-white shadow-xl flex md:flex-col items-center justify-between p-2 md:py-6 z-30 order-2 md:order-1 flex-shrink-0">
        
        <!-- 工具按鈕區 (上一步、下一步、清除) -->
        <div class="flex md:flex-col gap-2 md:gap-3 flex-shrink-0 px-2 md:px-0">
            <button id="undoBtn" class="w-11 h-11 md:w-14 md:h-14 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center shadow-sm active:bg-indigo-200 active:scale-95 transition-transform disabled:opacity-40 disabled:active:scale-100 disabled:cursor-not-allowed">
                <svg class="w-6 h-6 md:w-7 md:h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 10h10a5 5 0 0 1 5 5v2a5 5 0 0 1-5 5H8" />
                    <path d="M3 10l6-6" />
                    <path d="M3 10l6 6" />
                </svg>
            </button>
            <button id="redoBtn" class="w-11 h-11 md:w-14 md:h-14 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center shadow-sm active:bg-indigo-200 active:scale-95 transition-transform disabled:opacity-40 disabled:active:scale-100 disabled:cursor-not-allowed">
                <svg class="w-6 h-6 md:w-7 md:h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 10H11a5 5 0 0 0-5 5v2a5 5 0 0 0 5 5h5" />
                    <path d="M21 10l-6-6" />
                    <path d="M21 10l-6 6" />
                </svg>
            </button>
            <button id="clearBtn" class="w-11 h-11 md:w-14 md:h-14 bg-red-100 text-red-600 rounded-full flex items-center justify-center shadow-sm active:bg-red-200 active:scale-95 transition-transform">
                <svg class="w-6 h-6 md:w-7 md:h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2M10 11v6M14 11v6"/>
                </svg>
            </button>
        </div>

        <!-- 顏色選擇區 -->
        <div class="flex md:flex-col gap-3 md:gap-4 overflow-x-auto md:overflow-y-auto hide-scrollbar flex-1 items-center justify-start md:justify-center px-3 py-2 w-full">
            <div id="colorPalette" class="flex md:flex-col gap-3 md:gap-4"></div>
        </div>

        <!-- 翻頁按鈕區 -->
        <div class="flex md:flex-col gap-2 justify-center mt-auto flex-shrink-0 px-2 md:px-0">
            <button id="prevBtn" class="w-11 h-11 md:w-14 md:h-14 bg-green-100 text-green-600 rounded-2xl md:rounded-full flex items-center justify-center shadow-sm active:bg-green-200 active:scale-95 transition-transform">
                <svg class="w-7 h-7 md:w-10 md:h-10 transform md:-rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 19l-7-7 7-7" />
                </svg>
            </button>
            <button id="nextBtn" class="w-11 h-11 md:w-14 md:h-14 bg-green-100 text-green-600 rounded-2xl md:rounded-full flex items-center justify-center shadow-sm active:bg-green-200 active:scale-95 transition-transform">
                <svg class="w-7 h-7 md:w-10 md:h-10 transform md:-rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 5l7 7-7 7" />
                </svg>
            </button>
        </div>
    </div>

    <!-- 繪圖區 (右側或上方) -->
    <div class="flex-1 flex justify-center items-center p-3 md:p-6 relative order-1 md:order-2 min-h-0 min-w-0 h-full w-full">
        <!-- 畫布外框 -->
        <div id="canvasWrapper" class="relative bg-white rounded-3xl shadow-2xl overflow-hidden w-full h-full border-4 border-white">
            
            <!-- 繪圖用的 Canvas (底層) -->
            <canvas id="drawingCanvas" class="absolute inset-0 w-full h-full touch-none z-10"></canvas>
            
            <!-- SVG 輪廓圖案 (頂層，忽略點擊事件) -->
            <div id="svgContainer" class="absolute inset-0 w-full h-full pointer-events-none z-20 flex justify-center items-center p-6 md:p-12">
                <!-- SVG 動態插入 -->
            </div>

        </div>
    </div>

    <script>
        // 顏色設定
        const colors = ['#ef4444', '#f97316', '#fcd34d', '#22c55e', '#3b82f6', '#a855f7', '#ec4899', '#1f2937'];
        
        const strokeStyle = `fill="none" stroke="#1f2937" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"`;
        const templates = [
            // 1. Baby Shark (鯊魚寶寶)
            `<svg viewBox="0 0 100 100" class="w-full h-full max-w-full max-h-full drop-shadow-md" preserveAspectRatio="xMidYMid meet"><path d="M 40,32 L 48,10 L 55,33" ${strokeStyle}/><path d="M 45,65 L 50,85 L 60,65" ${strokeStyle}/><path d="M 15,55 C 20,25 65,25 75,45 L 95,30 L 90,55 L 95,80 L 75,65 C 65,85 20,85 15,55 Z" ${strokeStyle}/><circle cx="32" cy="45" r="4" fill="#1f2937" /><path d="M 20,55 Q 26,62 34,55" ${strokeStyle}/><path d="M 45,45 L 45,55 M 50,46 L 50,54" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/></svg>`,
            // 2. 胖胖小企鵝
            `<svg viewBox="0 0 100 100" class="w-full h-full max-w-full max-h-full drop-shadow-md" preserveAspectRatio="xMidYMid meet"><path d="M 50,10 C 20,10 15,55 20,80 C 30,90 70,90 80,80 C 85,55 80,10 50,10 Z" ${strokeStyle}/><path d="M 50,35 C 30,35 25,65 30,82 C 40,88 60,88 70,82 C 75,65 70,35 50,35 Z" ${strokeStyle}/><circle cx="38" cy="28" r="4" fill="#1f2937" /><circle cx="62" cy="28" r="4" fill="#1f2937" /><path d="M 45,35 L 55,35 L 50,42 Z" ${strokeStyle}/><path d="M 17,45 C -5,55 5,75 12,65" ${strokeStyle}/><path d="M 83,45 C 105,55 95,75 88,65" ${strokeStyle}/><path d="M 30,85 C 30,98 15,98 25,84" ${strokeStyle}/><path d="M 70,85 C 70,98 85,98 75,84" ${strokeStyle}/></svg>`
            // 為節省篇幅，此處保留前兩個圖案，其餘圖案陣列可完全沿用原代碼
        ];

        let currentTemplateIndex = 0;
        let currentColor = colors[0];
        let isDrawing = false;
        const brushSize = 35; 

        // 歷史紀錄狀態管理
        let history = [];
        let historyStep = -1;

        // 綁定 DOM
        const canvas = document.getElementById('drawingCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const canvasWrapper = document.getElementById('canvasWrapper');
        const svgContainer = document.getElementById('svgContainer');
        const colorPalette = document.getElementById('colorPalette');
        const undoBtn = document.getElementById('undoBtn');
        const redoBtn = document.getElementById('redoBtn');

        // 生成顏色按鈕
        colors.forEach((color, index) => {
            const btn = document.createElement('button');
            btn.className = `color-btn w-10 h-10 md:w-12 md:h-12 rounded-full flex-shrink-0 cursor-pointer ${index === 0 ? 'active' : ''}`;
            btn.style.backgroundColor = color;
            btn.style.color = color;
            btn.addEventListener('click', () => {
                document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentColor = color;
            });
            colorPalette.appendChild(btn);
        });

        function saveState() {
            if (historyStep < history.length - 1) {
                history.length = historyStep + 1;
            }
            history.push(canvas.toDataURL());
            historyStep++;
            updateHistoryButtons();
        }

        function undo() {
            if (historyStep > 0) {
                historyStep--;
                restoreState(history[historyStep]);
            } else if (historyStep === 0) {
                historyStep--;
                clearCanvas(false); 
            }
            updateHistoryButtons();
        }

        function redo() {
            if (historyStep < history.length - 1) {
                historyStep++;
                restoreState(history[historyStep]);
            }
            updateHistoryButtons();
        }

        function restoreState(dataUrl) {
            const img = new Image();
            img.onload = () => {
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const dpr = window.devicePixelRatio || 1;
                ctx.scale(dpr, dpr);
                ctx.drawImage(img, 0, 0, canvas.width / dpr, canvas.height / dpr);
            };
            img.src = dataUrl;
        }

        function updateHistoryButtons() {
            undoBtn.disabled = historyStep < 0;
            redoBtn.disabled = historyStep >= history.length - 1;
        }

        // 載入模板
        function loadTemplate() {
            // 🔐 資安修正：在此確保賦值的 templates 皆為內部靜態寫死字串。
            // 若未來改為從 API 獲取使用者上傳的 SVG，請務必先經過 DOMPurify 清洗：
            // svgContainer.innerHTML = DOMPurify.sanitize(templates[currentTemplateIndex]);
            svgContainer.innerHTML = templates[currentTemplateIndex];
            
            history = [];
            historyStep = -1;
            clearCanvas(false);
            updateHistoryButtons();
        }

        function clearCanvas(save = true) {
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const dpr = window.devicePixelRatio || 1;
            ctx.scale(dpr, dpr);
            if (save) saveState();
        }

        function resizeCanvas() {
            const rect = canvasWrapper.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            
            ctx.scale(dpr, dpr);
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            clearCanvas(false);
            history = [];
            historyStep = -1;
            updateHistoryButtons();
        }

        window.addEventListener('resize', resizeCanvas);

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: e.clientX - rect.left,
                y: e.clientY - rect.top
            };
        }

        canvas.addEventListener('pointerdown', (e) => {
            isDrawing = true;
            canvas.setPointerCapture(e.pointerId);
            const pos = getPos(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
            ctx.fillStyle = currentColor;
            ctx.arc(pos.x, pos.y, brushSize / 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!isDrawing) return;
            const pos = getPos(e);
            ctx.strokeStyle = currentColor;
            ctx.lineWidth = brushSize;
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
        });

        const stopDrawing = () => { 
            if (isDrawing) {
                isDrawing = false; 
                saveState();
            }
        };
        canvas.addEventListener('pointerup', stopDrawing);
        canvas.addEventListener('pointercancel', stopDrawing);

        document.getElementById('undoBtn').addEventListener('click', undo);
        document.getElementById('redoBtn').addEventListener('click', redo);
        
        document.getElementById('clearBtn').addEventListener('click', () => {
            if (historyStep >= 0) {
                clearCanvas(true);
            }
        });
        
        document.getElementById('nextBtn').addEventListener('click', () => {
            currentTemplateIndex = (currentTemplateIndex + 1) % templates.length;
            loadTemplate();
        });
        document.getElementById('prevBtn').addEventListener('click', () => {
            currentTemplateIndex = (currentTemplateIndex - 1 + templates.length) % templates.length;
            loadTemplate();
        });

        // 初始化
        setTimeout(() => {
            resizeCanvas();
            loadTemplate();
        }, 100);
    </script>
</body>
</html>
